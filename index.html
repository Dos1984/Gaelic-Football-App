<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAA Skills Coach Prototype</title><style>
:root{--g:#2563a6;--gd:#123f73;--lime:#dcecff;--bg:#eaf2fb;--ink:#18324d;--mut:#60758b;--card:#fff;--line:#d4e1ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--gd),var(--g));color:white;padding:22px 18px}.wrap{max-width:980px;margin:auto}.brand{font-size:28px;font-weight:900}.sub{opacity:.9;margin-top:3px}.tabs{display:flex;gap:8px;margin:18px 0}.tab,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.tab{background:#dce8f5;color:#244b72}.tab.active,.btn{background:var(--g);color:white}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 14px #14351e0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}select,input{width:100%;padding:11px;border:1px solid #c7d8e8;border-radius:10px;background:white}.skills{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 11px;border:1px solid #b9cfe3;border-radius:999px;cursor:pointer;background:white;font-weight:700}.chip.on{background:var(--lime);border-color:#6e9bc8}.bib-options{display:flex;gap:10px;flex-wrap:wrap}.bib-option{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid #b9cfe3;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.bib-option input{width:20px;height:20px;margin:0}.bib-swatch{width:22px;height:22px;border-radius:6px;border:1px solid #0002}.bib-yellow{background:#f3d33b}.bib-red{background:#d94b4b}.bib-blue{background:#3b77d0}.bib-green{background:#2a9b57}.row{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#dbe8f5;color:var(--gd)}.session{margin-top:18px}.station{border-left:8px solid #e7c51b}.station.red{border-color:#d94b4b}.station.blue{border-color:#3b77d0}.station.green{border-color:#2a9b57}.diagram{height:130px;border-radius:14px;background:#e7f0fa;position:relative;overflow:hidden;margin:10px 0}.pitch{position:absolute;inset:12px;border:2px solid #78a0c7;border-radius:8px}.cone{position:absolute;width:12px;height:12px;background:#f39c12;clip-path:polygon(50% 0,100% 100%,0 100%)}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #222}.player{position:absolute;width:24px;height:24px;border-radius:50%;background:#2563a6;color:#fff;text-align:center;font-size:11px;line-height:24px;font-weight:900}.meta{color:var(--mut);font-size:13px}.tick{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;margin:9px 0}.tick input{width:24px;height:24px}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#dfeaf5;border:4px solid white;box-shadow:0 2px 8px #0002}.hero{display:flex;align-items:center;gap:15px}.star{font-size:50px}.hidden{display:none}@media print{header,.tabs,.controls,.secondary{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head><body><header><div class="wrap"><div class="brand">🏐 GAA Skills Coach</div><div class="sub">Fun first · Everyone included · Lots of touches</div></div></header><main class="wrap"><div class="tabs"><button class="tab active" data-tab="coach">🏟 Coach Mode</button><button class="tab" data-tab="home">🏠 Home Skills</button></div>
<section id="coach" class="panel active"><div class="card controls"><h2>Build a training session</h2><div class="grid"><div><label>Age group</label><select id="age"><option>U7</option><option>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div><div><label>Players</label><input id="players" type="number" value="24" min="4"></div><div><label>Session length</label><select id="length"><option>30</option><option selected>40</option><option>45</option><option>60</option></select></div><div><label>Stations</label><select id="stations"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div><label>Level</label><select id="level"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div><div><label>Minutes / station</label><select id="mins"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div></div><h3>Skills</h3><div class="skills" id="skillChips"></div><h3>Bib colours in use</h3><p class="meta">Tick the bib colours available. The app will allocate the selected colours to stations and rotate them in order.</p><div class="bib-options" id="bibOptions"><label class="bib-option"><input type="checkbox" value="Yellow" checked><span class="bib-swatch bib-yellow"></span>Yellow</label><label class="bib-option"><input type="checkbox" value="Red" checked><span class="bib-swatch bib-red"></span>Red</label><label class="bib-option"><input type="checkbox" value="Blue" checked><span class="bib-swatch bib-blue"></span>Blue</label><label class="bib-option"><input type="checkbox" value="Green" checked><span class="bib-swatch bib-green"></span>Green</label></div><div class="grid" style="margin-top:14px"><div><label>Matches at end?</label><select id="matches"><option value="yes">Yes</option><option value="no">No</option></select></div><div><label>Number of match pitches</label><select id="pitches"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div><p><button class="btn" onclick="generateSession()">Generate session</button></p></div><div id="sessionOut" class="session"></div></section>
<section id="home" class="panel"><div class="card controls"><h2>Create a weekly home programme</h2><div class="grid"><div><label>Child's name</label><input id="child" value="Sam"></div><div><label>Age group</label><select id="homeAge"><option>U7</option><option selected>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div><div><label>Week</label><input id="week" value="Winter Skills · Week 1"></div><div><label>Reward</label><input id="reward" value="Choose Friday's family movie"></div></div><label style="margin-top:12px">Child photo / avatar</label><input type="file" id="photo" accept="image/*"><h3>Skills to practise</h3><div class="skills" id="homeSkillChips"></div><p><button class="btn" onclick="generateHome()">Generate weekly programme</button></p></div><div id="homeOut"></div></section></main>
<script>
const skills=['Hand / Fist Pass','Solo / Ball Carry','Kicking','Catching','Crouch Lift','Agility / Evasion','Scoring','Decision Making']; const bibs=['Yellow','Red','Blue','Green'];
function chips(id,items,defaults){let el=document.getElementById(id);items.forEach((s,i)=>{let b=document.createElement('button');b.className='chip '+(defaults.includes(i)?'on':'');b.textContent=s;b.onclick=()=>b.classList.toggle('on');el.appendChild(b)})}chips('skillChips',skills,[0,1,2,3]);chips('homeSkillChips',skills,[0,1,2]);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
const drills={
'Hand / Fist Pass':['Pass & Follow','Gate Hand Pass','Moving Receiver'], 'Solo / Ball Carry':['Solo Slalom','Carry, Turn & Go','Side-Step, Bounce & Score'], 'Kicking':['Bridge Kicks','Goal-to-Goal Punt Kick','Hit the Cones'], 'Catching':['Toss, Turn & Catch','Low-Catch Guard','Piggy in the Middle Catch'], 'Crouch Lift':['Crouch Lift Gates','Lift & Carry Relay','Pick-Up to Pass'], 'Agility / Evasion':['Side-Step Slalom','Traffic Lights Adventure','Shadow & Escape'], 'Scoring':['Score Through the Gates','Move & Finish','Mini Goal Challenge'], 'Decision Making':['3 v 3 End Zone','Find the Free Player','Tackle the Ball']};
function selected(id){return [...document.querySelectorAll('#'+id+' .chip.on')].map(x=>x.textContent)}
function diagram(){return `<div class="diagram"><div class="pitch"></div><span class="player" style="left:18%;top:45%">1</span><span class="player" style="left:68%;top:45%">2</span><span class="ball" style="left:47%;top:48%"></span><span class="cone" style="left:12%;top:18%"></span><span class="cone" style="right:12%;bottom:18%"></span></div>`}
function generateSession(){let ss=selected('skillChips'), bs=[...document.querySelectorAll('#bibOptions input:checked')].map(x=>x.value);if(!bs.length){alert('Please tick at least one bib colour.');return;}let n=+stations.value, pp=Math.ceil(+players.value/n), html=`<div class="card"><h2>${age.value} · ${length.value}-minute session</h2><div class="meta">${players.value} players · ${n} stations · ${level.value} · ${mins.value} min each</div></div>`;for(let i=0;i<n;i++){let sk=ss[i%ss.length]||'Catching', name=drills[sk][i%3], bib=bs[i%bs.length]||bibs[i%4];html+=`<div class="card station ${bib.toLowerCase()}"><h3>${bib} · Station ${i+1}: ${name}</h3><div class="meta">${sk} · ~${pp} players · ${mins.value} minutes</div>${diagram()}<b>Set-up</b><p>Use a small marked area, footballs and cones. Keep queues short and maximise touches.</p><b>How to play</b><p>Players complete the skill, move immediately to a new position and repeat. Rotate roles frequently.</p><b>Coaching cues</b><p>Head up · balanced body position · soft controlled touch · move after releasing the ball.</p><b>${level.value} progression</b><p>${level.value==='Beginner'?'Reduce distance and pressure; demonstrate first.':level.value==='Intermediate'?'Add movement, a target and a simple choice.':'Add active pressure, a defender and game-like decisions.'}</p><button class="btn secondary" onclick="this.closest('.station').querySelector('h3').lastChild.textContent=' '+drills['${sk}'][Math.floor(Math.random()*3)]">↻ Regenerate drill</button></div>`}if(matches.value==='yes')html+=`<div class="card"><h3>🏁 Matches</h3><p>${pitches.value} small-sided pitches. Split players as evenly as possible, prioritising small teams, equal playing time and frequent involvement.</p></div>`;html+=`<div class="card controls row"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn secondary" onclick="generateSession()">Regenerate full session</button></div>`;sessionOut.innerHTML=html;sessionOut.scrollIntoView({behavior:'smooth'})}
let avatar='';photo.onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>avatar=r.result;r.readAsDataURL(f)}};
function generateHome(){let ss=selected('homeSkillChips').slice(0,4), av=avatar?`<img class="avatar" src="${avatar}">`:`<div class="avatar" style="display:grid;place-items:center;font-size:40px">🏐</div>`;let h=`<div class="card"><div class="hero">${av}<div><h2>${child.value}'s Football Skills</h2><div class="meta">${week.value} · ${homeAge.value}</div></div></div><h3>This week's challenge</h3>`;ss.forEach((s,i)=>h+=`<label class="tick"><input type="checkbox" onchange="checkComplete()"><div><b>${s}</b><div class="meta">${i%2?'10 successful attempts':'Practise for 10 minutes'} · ${drills[s][0]}</div></div></label>`);h+=`<div class="card" style="background:#eaf3fc"><b>🎁 My reward</b><p>${reward.value||'Parent chooses a reward'}</p></div><div id="success" class="hidden"><div class="star">⭐</div><h2>WEEK COMPLETE!</h2><p>${child.value} completed every football skills challenge.</p></div><div class="row controls"><button class="btn" onclick="window.print()">Certificate / PDF</button></div></div>`;homeOut.innerHTML=h;homeOut.scrollIntoView({behavior:'smooth'})}
function checkComplete(){let c=[...homeOut.querySelectorAll('input[type=checkbox]')];let ok=c.length&&c.every(x=>x.checked);document.getElementById('success').classList.toggle('hidden',!ok);localStorage.setItem('gaa-home-'+child.value,JSON.stringify(c.map(x=>x.checked)))}
generateSession();
</script></body></html>
