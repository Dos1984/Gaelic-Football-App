<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAA Skills App</title>
<style>
:root{--blue:#2563a6;--dark:#123f73;--bg:#eaf2fb;--ink:#18324d;--muted:#60758b;--line:#d4e1ee;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:20px 16px}.wrap{max-width:980px;margin:auto}.brand{font-size:27px;font-weight:900}.version{font-size:11px;opacity:.75;margin-top:3px}
.tabs{display:flex;gap:8px;margin:16px 0}.tab,.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px;cursor:pointer}.tab{background:#dce8f5;color:#244b72}.tab.active,.btn{background:var(--blue);color:#fff}.secondary{background:#dbe8f5;color:var(--dark)}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 14px rgba(20,53,30,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}label{font-size:13px;font-weight:800;display:block;margin:0 0 5px}
select,input,textarea{width:100%;padding:11px;border:1px solid #c7d8e8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:115px;resize:vertical}
.skills,.row,.bib-options{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;border:1px solid #b9cfe3;border-radius:999px;background:#fff;font-weight:700}.chip.on{background:#dcecff;border-color:#6e9bc8}
.bib-option{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #b9cfe3;border-radius:12px;background:#fff}.bib-option input{width:20px;height:20px;margin:0}.swatch{width:20px;height:20px;border-radius:5px}.yellow{background:#f3d33b}.red{background:#d94b4b}.blue{background:#3b77d0}.green{background:#2a9b57}
.meta{color:var(--muted);font-size:13px}.station{border-left:8px solid #2563a6}.source-img{width:100%;max-height:380px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#f8fbff;margin:10px 0}
.diagram{height:125px;border-radius:12px;background:#e7f0fa;position:relative;margin:10px 0}.diagram:before{content:"";position:absolute;inset:12px;border:2px solid #78a0c7;border-radius:8px}
.tick{padding:13px;border:1px solid var(--line);border-radius:14px;margin:9px 0}.tickrow{display:flex;gap:12px;align-items:center}.tickrow input{width:26px;height:26px}.sharebox,.summary{background:#f1f7fd;border:1px solid #bcd4ea;border-radius:14px;padding:14px;margin-top:14px}
.notice{background:#fff0f0;border:1px solid #e4a4a4;color:#9f1d1d;padding:11px;border-radius:10px;margin:10px 0}.hidden{display:none}.success{text-align:center;padding:14px}.star{font-size:48px}
.parent-mode .tabs,.parent-mode #coach,.parent-mode #homeSetup{display:none!important}.parent-mode #home{display:block!important}
@media print{header,.tabs,.controls{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand">🏐 GAA Skills App</div><div class="version">Clean rebuild v1.0</div></div></header>
<main class="wrap">
<div class="tabs" id="tabs">
<button type="button" class="tab active" id="coachTab" onclick="showPanel('coach')">🏟 Coach Mode</button>
<button type="button" class="tab" id="homeTab" onclick="showPanel('home')">🏠 Home Skills</button>
</div>

<section id="coach" class="panel active">
<div class="card controls">
<h2>Build a training session</h2>
<label>Quick session entry — type or dictate using your phone keyboard</label>
<textarea id="quickText" placeholder="Example: U9, 20 players, 30 minute session, 4 stations, intermediate, 8 minutes per station, red blue yellow bibs, match at the end on 3 pitches."></textarea>
<div class="row" style="margin:9px 0 16px"><button type="button" class="btn secondary" onclick="readQuick()">Read & fill session</button></div>
<div class="grid">
<div><label>Age group</label><select id="age"><option>U7</option><option>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div>
<div><label>Players</label><input id="players" type="number" min="4" value="24"></div>
<div><label>Session length (minutes)</label><input id="sessionLength" type="number" min="15" max="180" step="5" value="40"></div>
<div><label>Stations</label><select id="stations"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
<div><label>Level</label><select id="level"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div>
<div><label>Minutes / station</label><select id="stationMinutes"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div>
</div>
<h3>Skills</h3><div class="skills" id="coachSkills"></div>
<h3>Bib colours in use</h3>
<div class="bib-options">
<label class="bib-option"><input class="bib" type="checkbox" value="Yellow" checked><span class="swatch yellow"></span>Yellow</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Red" checked><span class="swatch red"></span>Red</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Blue" checked><span class="swatch blue"></span>Blue</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Green" checked><span class="swatch green"></span>Green</label>
</div>
<div class="grid" style="margin-top:14px">
<div><label>Matches at end?</label><select id="matches"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div><label>Match pitches</label><select id="pitches"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
</div>
<div id="coachNotice"></div>
<p><button type="button" class="btn" onclick="generateSession()">Generate session</button></p>
</div>
<div id="sessionOut"></div>
</section>

<section id="home" class="panel">
<div id="homeSetup" class="card controls">
<h2>Create a weekly home programme</h2>
<p class="meta">Choose the programme, then create a parent-only link. Parents will not see Coach Mode.</p>
<div class="grid">
<div><label>Age group</label><select id="homeAge"><option>U7</option><option selected>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div>
<div><label>Week</label><input id="week" value="Winter Skills · Week 1"></div>
<div><label>Reward (optional)</label><input id="reward" value="Choose Friday's family movie"></div>
</div>
<h3>Skills to practise</h3><div class="skills" id="homeSkills"></div>
<p><button type="button" class="btn" onclick="generateHome()">Generate weekly programme & parent link</button></p>
<div id="shareArea"></div>
</div>
<div id="homeOut"></div>
</section>
</main>

<script>
(function(){
"use strict";
var SKILLS=["Hand / Fist Pass","Solo / Ball Carry","Kicking","Catching","Crouch Lift","Agility / Evasion","Scoring","Decision Making"];
var DRILLS={
"Hand / Fist Pass":["Pass & Follow","Gate Hand Pass","Moving Receiver"],
"Solo / Ball Carry":["Solo Slalom","Carry, Turn & Go","Side-Step, Bounce & Score"],
"Kicking":["Bridge Kicks","Goal-to-Goal Punt Kick","Hit the Cones"],
"Catching":["Toss, Turn & Catch","Low-Catch Guard","Piggy in the Middle Catch"],
"Crouch Lift":["Crouch Lift Gates","Lift & Carry Relay","Pick-Up to Pass"],
"Agility / Evasion":["Side-Step Slalom","Traffic Lights Adventure","Shadow & Escape"],
"Scoring":["Score Through the Gates","Move & Finish","Mini Goal Challenge"],
"Decision Making":["3 v 3 End Zone","Find the Free Player","Tackle the Ball"]
};
var IMAGES={
"Hand / Fist Pass":"https://gaa-pathway-resources.com/images/skill_cards/gaa_skill_cards/fist_pass_skillcard_front.jpg",
"Catching":"https://learning.gaa.ie/sites/default/files/Coach/Files/High-Catch-skillcard_09_aw-1.png",
"Crouch Lift":"https://gaa-pathway-resources.com/images/skill_cards/gaa_skill_cards/crouch_list_skillcard_front.jpg"
};
function el(id){return document.getElementById(id)}
function escapeHtml(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function makeChips(id,defaults){var box=el(id);for(var i=0;i<SKILLS.length;i++){var b=document.createElement("button");b.type="button";b.className="chip"+(defaults.indexOf(i)>=0?" on":"");b.appendChild(document.createTextNode(SKILLS[i]));b.onclick=function(){this.className=this.className.indexOf(" on")>=0?"chip":"chip on"};box.appendChild(b)}}
function selectedSkills(id){var a=[],nodes=el(id).getElementsByClassName("chip");for(var i=0;i<nodes.length;i++){if(nodes[i].className.indexOf(" on")>=0)a.push(nodes[i].textContent)}return a}
function setSelect(id,value){var x=el(id),opts=x.options;for(var i=0;i<opts.length;i++){if(String(opts[i].value).toLowerCase()===String(value).toLowerCase()){x.selectedIndex=i;return}}}
window.showPanel=function(name){el("coach").className="panel"+(name==="coach"?" active":"");el("home").className="panel"+(name==="home"?" active":"");el("coachTab").className="tab"+(name==="coach"?" active":"");el("homeTab").className="tab"+(name==="home"?" active":"");window.scrollTo(0,0)};
function art(skill){if(IMAGES[skill])return '<img class="source-img" src="'+IMAGES[skill]+'" alt="'+escapeHtml(skill)+' skill diagram">';return '<div class="diagram" aria-label="Drill setup diagram"></div>'}
window.readQuick=function(){var t=el("quickText").value.toLowerCase();var m=t.match(/(?:under\s*)?u?\s*(7|8|9|10|11|12)\b/);if(m)setSelect("age","U"+m[1]);m=t.match(/(\d+)\s*(?:players|children|kids)/);if(m)el("players").value=m[1];m=t.match(/(?:session(?:\s+length)?(?:\s+(?:is|about|around))?|for)\s*(\d{2,3})\s*(?:minutes|minute|mins|min)\b/);if(!m)m=t.match(/(\d{2,3})[ -]*(?:minute|min)\s+session/);if(m)el("sessionLength").value=m[1];m=t.match(/(\d+)\s*stations?/);if(m)setSelect("stations",m[1]);if(t.indexOf("beginner")>=0)setSelect("level","Beginner");else if(t.indexOf("advanced")>=0)setSelect("level","Advanced");else if(t.indexOf("intermediate")>=0)setSelect("level","Intermediate");m=t.match(/(5|8|10|15)\s*(?:minutes|minute|mins|min)\s*(?:each|per station)/);if(m)setSelect("stationMinutes",m[1]);if(/\b(no|without|skip)\s+(match|matches|game|games)/.test(t))setSelect("matches","no");else if(/\b(match|matches|game|games)\b/.test(t))setSelect("matches","yes");m=t.match(/(1|2|3|4)\s*(?:match\s*)?(?:pitch|pitches|picture|pictures)/);if(m)setSelect("pitches",m[1]);var bibs=document.getElementsByClassName("bib"),any=false;for(var i=0;i<bibs.length;i++){var hit=t.indexOf(bibs[i].value.toLowerCase())>=0;if(hit)any=true;bibs[i].checked=hit}if(!any)for(i=0;i<bibs.length;i++)bibs[i].checked=true};
window.generateSession=function(){var ss=selectedSkills("coachSkills");if(!ss.length){el("coachNotice").innerHTML='<div class="notice">Please choose at least one skill.</div>';return}var bibs=[],bs=document.getElementsByClassName("bib");for(var i=0;i<bs.length;i++)if(bs[i].checked)bibs.push(bs[i].value);if(!bibs.length){el("coachNotice").innerHTML='<div class="notice">Please choose at least one bib colour.</div>';return}el("coachNotice").innerHTML="";var n=parseInt(el("stations").value,10),players=parseInt(el("players").value,10),pp=Math.ceil(players/n),h='<div class="card"><h2>'+escapeHtml(el("age").value)+' · '+escapeHtml(el("sessionLength").value)+'-minute session</h2><div class="meta">'+players+' players · '+n+' stations · '+escapeHtml(el("level").value)+'</div></div>';for(i=0;i<n;i++){var sk=ss[i%ss.length],dr=DRILLS[sk][i%DRILLS[sk].length],bib=bibs[i%bibs.length];h+='<div class="card station"><h3>'+escapeHtml(bib)+' · Station '+(i+1)+': '+escapeHtml(dr)+'</h3><div class="meta">'+escapeHtml(sk)+' · about '+pp+' players · '+escapeHtml(el("stationMinutes").value)+' minutes</div>'+art(sk)+'<b>Set-up</b><p>Use a small marked area, footballs and cones. Keep queues short and maximise touches.</p><b>Coaching cues</b><p>Head up · balanced body position · controlled touch · move after releasing the ball.</p></div>'}if(el("matches").value==="yes")h+='<div class="card"><h3>🏁 Matches</h3><p>'+escapeHtml(el("pitches").value)+' small-sided pitches. Split players evenly and prioritise equal playing time.</p></div>';h+='<div class="card controls"><button type="button" class="btn" onclick="window.print()">Print / Save as PDF</button></div>';el("sessionOut").innerHTML=h;el("sessionOut").scrollIntoView()};
function programme(){var ss=selectedSkills("homeSkills"),arr=[];for(var i=0;i<ss.length&&i<4;i++)arr.push({skill:ss[i],target:i%2?"10 successful attempts":"Practise for 10 minutes",drill:DRILLS[ss[i]][0]});return {age:el("homeAge").value,week:el("week").value,reward:el("reward").value,skills:arr}}
function encodeData(o){var json=encodeURIComponent(JSON.stringify(o)),b64=btoa(unescape(json));return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decodeData(v){try{v=v.replace(/-/g,"+").replace(/_/g,"/");while(v.length%4)v+="=";return JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){return null}}
window.generateHome=function(){var d=programme();if(!d.skills.length){el("shareArea").innerHTML='<div class="notice">Please choose at least one Home Skill.</div>';return}renderHome(d,false);var url=location.origin+location.pathname+"?home="+encodeData(d);el("shareArea").innerHTML='<div class="sharebox"><b>Parent Home Skills link</b><p class="meta">This opens only the assigned home programme.</p><input id="parentLink" readonly value="'+escapeHtml(url)+'"><div class="row" style="margin-top:9px"><button type="button" class="btn" onclick="copyParentLink()">Copy parent link</button><button type="button" class="btn secondary" onclick="previewParent()">Preview parent page</button></div></div>'};
window.copyParentLink=function(){var x=el("parentLink");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x.value)}else{x.select();document.execCommand("copy")}};
window.previewParent=function(){window.open(el("parentLink").value,"_blank")};
function progressKey(){return "gaa-home-"+(new URLSearchParams(location.search).get("home")||"coach")}
function renderHome(d,parent){var h='<div class="card"><h2>'+(parent?"Home Football Skills":"Weekly Home Programme")+'</h2><div class="meta">'+escapeHtml(d.week)+' · '+escapeHtml(d.age)+'</div>';if(parent)h+='<div style="margin-top:14px"><label>Child\'s name</label><input id="parentChild" placeholder="Enter child\'s name" oninput="saveProgress()"></div>';h+='<h3>This week\'s skills</h3>';for(var i=0;i<d.skills.length;i++){var x=d.skills[i];h+='<div class="tick"><div class="tickrow"><input class="homeCheck" type="checkbox" onchange="checkHome()"><div><b>'+escapeHtml(x.skill)+'</b><div class="meta">'+escapeHtml(x.target)+' · '+escapeHtml(x.drill)+'</div></div></div>'+art(x.skill)+'</div>'}if(d.reward)h+='<div class="sharebox"><b>🎁 Reward</b><p>'+escapeHtml(d.reward)+'</p></div>';h+='<div id="success" class="success hidden"><div class="star">⭐</div><h2>WEEK COMPLETE!</h2></div>';if(parent)h+='<p><button type="button" class="btn" onclick="submitWeek()">Submit week to coach</button></p><div id="submitOut"></div>';h+='</div>';el("homeOut").innerHTML=h;if(parent)restoreProgress()}
window.saveProgress=function(){if(document.body.className.indexOf("parent-mode")<0)return;var c=document.getElementsByClassName("homeCheck"),checks=[];for(var i=0;i<c.length;i++)checks.push(c[i].checked);var nm=el("parentChild")?el("parentChild").value:"";localStorage.setItem(progressKey(),JSON.stringify({name:nm,checks:checks}))};
window.checkHome=function(){var c=document.getElementsByClassName("homeCheck"),ok=c.length>0;for(var i=0;i<c.length;i++)if(!c[i].checked)ok=false;var s=el("success");if(s)s.className=ok?"success":"success hidden";window.saveProgress()};
function restoreProgress(){try{var p=JSON.parse(localStorage.getItem(progressKey())||"{}");if(p.name)el("parentChild").value=p.name;var c=document.getElementsByClassName("homeCheck");for(var i=0;i<c.length;i++)c[i].checked=!!(p.checks&&p.checks[i]);window.checkHome()}catch(e){}}
window.submitWeek=function(){var nm=el("parentChild").value.replace(/^\s+|\s+$/g,"");if(!nm){el("submitOut").innerHTML='<div class="notice">Please enter the child\'s name first.</div>';return}var q=new URLSearchParams(location.search).get("home"),d=decodeData(q),c=document.getElementsByClassName("homeCheck"),lines=[],done=0;for(var i=0;i<d.skills.length;i++){if(c[i].checked)done++;lines.push((c[i].checked?"✓ ":"○ ")+d.skills[i].skill+" — "+(c[i].checked?"Completed":"Not completed"))}var msg="GAA Home Skills — "+d.week+"\nChild: "+nm+"\n\n"+lines.join("\n")+"\n\nCompleted: "+done+"/"+d.skills.length;window._summary=msg;el("submitOut").innerHTML='<div class="summary"><b>Weekly progress ready to send</b><p>'+escapeHtml(lines.join("\n")).replace(/\n/g,"<br>")+'</p><div class="row"><a class="btn" style="text-decoration:none" href="mailto:?subject='+encodeURIComponent("GAA Home Skills — "+nm)+'&body='+encodeURIComponent(msg)+'">Send by email</a><button type="button" class="btn secondary" onclick="copySummary()">Copy summary</button></div></div>'};
window.copySummary=function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(window._summary||"")};
function init(){makeChips("coachSkills",[0,1,2,3]);makeChips("homeSkills",[0,1,2]);var q=new URLSearchParams(location.search).get("home");if(q){var d=decodeData(q);if(d){document.body.className="parent-mode";el("brand").textContent="🏐 GAA Home Skills";renderHome(d,true);return}}window.showPanel("coach")}
init();
})();
</script>
</body>
</html>
