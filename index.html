<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAA Skills App</title>
<style>
:root{--blue:#2563a6;--dark:#123f73;--bg:#eaf2fb;--ink:#18324d;--muted:#60758b;--line:#d4e1ee;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:20px 16px}.wrap{max-width:980px;margin:auto}.brand{font-size:27px;font-weight:900}.version{font-size:11px;opacity:.75;margin-top:3px}
.tabs{display:flex;gap:8px;margin:16px 0}.tab,.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px;cursor:pointer}.tab{background:#dce8f5;color:#244b72}.tab.active,.btn{background:var(--blue);color:#fff}.secondary{background:#dbe8f5;color:var(--dark)}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 14px rgba(20,53,30,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}label{font-size:13px;font-weight:800;display:block;margin:0 0 5px}
select,input,textarea{width:100%;padding:11px;border:1px solid #c7d8e8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:115px;resize:vertical}
.skills,.row,.bib-options{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;border:1px solid #b9cfe3;border-radius:999px;background:#fff;font-weight:700}.chip.on{background:#dcecff;border-color:#6e9bc8}
.bib-option{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #b9cfe3;border-radius:12px;background:#fff}.bib-option input{width:20px;height:20px;margin:0}.swatch{width:20px;height:20px;border-radius:5px}.yellow{background:#f3d33b}.red{background:#d94b4b}.blue{background:#3b77d0}.green{background:#2a9b57}
.meta{color:var(--muted);font-size:13px}.station{border-left:8px solid #2563a6}.source-img{width:100%;max-height:380px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#f8fbff;margin:10px 0}
.diagram{height:125px;border-radius:12px;background:#e7f0fa;position:relative;margin:10px 0}.diagram:before{content:"";position:absolute;inset:12px;border:2px solid #78a0c7;border-radius:8px}
.tick{padding:13px;border:1px solid var(--line);border-radius:14px;margin:9px 0}.tickrow{display:flex;gap:12px;align-items:center}.tickrow input{width:26px;height:26px}.sharebox,.summary{background:#f1f7fd;border:1px solid #bcd4ea;border-radius:14px;padding:14px;margin-top:14px}
.notice{background:#fff0f0;border:1px solid #e4a4a4;color:#9f1d1d;padding:11px;border-radius:10px;margin:10px 0}.hidden{display:none}.success{text-align:center;padding:14px}.star{font-size:48px}
.parent-mode .tabs,.parent-mode #coach,.parent-mode #homeSetup{display:none!important}.parent-mode #home{display:block!important}
@media print{header,.tabs,.controls{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand">🏐 GAA Skills App</div><div class="version">Clean rebuild v1.4</div></div></header>
<main class="wrap">
<div class="tabs" id="tabs">
<button type="button" class="tab active" id="coachTab" onclick="showPanel('coach')">🏟 Coach Mode</button>
<button type="button" class="tab" id="homeTab" onclick="showPanel('home')">🏠 Home Skills</button>
</div>

<section id="coach" class="panel active">
<div class="card controls">
<h2>Build a training session</h2>
<label>Quick session entry — type or dictate using your phone keyboard</label>
<textarea id="quickText" placeholder="Example: U9, 20 players, 30 minute session, 4 stations, intermediate, 8 minutes per station, red blue yellow bibs, match at the end on 3 pitches."></textarea>
<div class="row" style="margin:9px 0 16px"><button type="button" class="btn secondary" onclick="readQuick()">Read & fill session</button></div>
<div class="grid">
<div><label>Age group</label><select id="age"><option>U7</option><option>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div>
<div><label>Players</label><input id="players" type="number" min="4" value="24"></div>
<div><label>Session length (minutes)</label><input id="sessionLength" type="number" min="15" max="180" step="5" value="40"></div>
<div><label>Stations</label><select id="stations"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
<div><label>Level</label><select id="level"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div>
<div><label>Minutes / station</label><select id="stationMinutes"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div>
</div>
<h3>Skills</h3><div class="skills" id="coachSkills"></div>
<h3>Bib colours in use</h3>
<div class="bib-options">
<label class="bib-option"><input class="bib" type="checkbox" value="Yellow" checked><span class="swatch yellow"></span>Yellow</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Red" checked><span class="swatch red"></span>Red</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Blue" checked><span class="swatch blue"></span>Blue</label>
<label class="bib-option"><input class="bib" type="checkbox" value="Green" checked><span class="swatch green"></span>Green</label>
</div>
<div class="grid" style="margin-top:14px">
<div><label>Matches at end?</label><select id="matches"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div><label>Match pitches</label><select id="pitches"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
</div>
<div id="coachNotice"></div>
<p><button type="button" class="btn" onclick="generateSession()">Generate session</button></p>
</div>
<div id="sessionOut"></div>
</section>

<section id="home" class="panel">
<div id="homeSetup" class="card controls">
<h2>Create a weekly home programme</h2>
<p class="meta"><b>Coach:</b> choose only the age, week and skills. <b>The parent enters the child’s name and chooses the reward after opening the link.</b></p>
<div class="grid">
<div><label>Age group</label><select id="homeAge"><option>U7</option><option selected>U8</option><option>U9</option><option>U10</option><option>U11</option><option>U12</option></select></div>
<div><label>Week</label><input id="week" value="Winter Skills · Week 1"></div>
<div><label>Level</label><select id="homeLevel"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div>
</div>
<h3>Skills to practise</h3><div class="skills" id="homeSkills"></div>
<p><button type="button" class="btn" onclick="generateHome()">Generate weekly programme & parent link</button></p>
<div id="shareArea"></div>
</div>
<div id="homeOut"></div>
</section>
</main>

<script>
(function(){
"use strict";
var SKILLS=["Hand / Fist Pass","Solo / Ball Carry","Kicking","Catching","Crouch Lift","Agility / Evasion","Scoring","Decision Making"];
var DRILLS={
"Hand / Fist Pass":["Pass & Follow","Gate Hand Pass","Moving Receiver","Give & Go Passing","Pass Through the Gates"],
"Solo / Ball Carry":["Solo Slalom","Carry, Turn & Go","Side-Step, Bounce & Score","Solo Around the Square","Solo, Turn & Pass"],
"Kicking":["Bridge Kicks","Goal-to-Goal Punt Kick","Hit the Cones","Kick Through the Gates","Move & Kick to Target"],
"Catching":["Toss, Turn & Catch","Low-Catch Guard","Piggy in the Middle Catch","Move & Catch","Catch and Release"],
"Crouch Lift":["Crouch Lift Gates","Lift & Carry Relay","Pick-Up to Pass","Lift, Turn & Go","Crouch Lift Circuit"],
"Agility / Evasion":["Side-Step Slalom","Traffic Lights Adventure","Shadow & Escape","Gate Evasion","Turn & Escape"],
"Scoring":["Score Through the Gates","Move & Finish","Mini Goal Challenge","Accuracy Challenge","Receive & Score"],
"Decision Making":["3 v 3 End Zone","Find the Free Player","Tackle the Ball","Two-Gate Choice","Pass or Carry"]
};
var LEVEL_DRILLS={
"Beginner":{
"Hand / Fist Pass":["Stationary Partner Pass","Pass Through the Gate","Pass & Follow","Target Hand Pass","Short Passing Circle"],
"Solo / Ball Carry":["Stationary Toe Tap","Walk and Solo","Solo Through Gates","Carry and Toe Tap","Straight-Line Solo"],
"Kicking":["Stationary Punt Kick","Kick Through Wide Gates","Partner Punt Kick","Kick to a Target","Short Kick and Follow"],
"Catching":["Self Toss and Catch","Partner Body Catch","Move to the Ball","Low Catch Practice","Catch and Pass"],
"Crouch Lift":["Stationary Crouch Lift","Lift Through Gates","Lift and Carry","Lift and Pass","Crouch Lift Relay"],
"Agility / Evasion":["Side-Step Slalom","Traffic Lights","Cone Weave","Mirror Movement","Gate Evasion"],
"Scoring":["Wide Goal Scoring","Score Through Gates","Close-Range Finish","Target Score","Receive and Score"],
"Decision Making":["Find the Free Gate","Pass to Free Player","Colour Call","Two-Gate Choice","3 v 1 Keep Ball"]},
"Intermediate":{
"Hand / Fist Pass":["Moving Receiver","Give & Go Passing","Pass Through the Gates","Triangle Pass and Move","4 v 1 Keep Ball"],
"Solo / Ball Carry":["Solo Slalom","Solo Around the Square","Solo, Turn & Pass","Solo Through Traffic","Solo, Side-Step & Score"],
"Kicking":["Bridge Kicks","Goal-to-Goal Punt Kick","Hit the Cones","Move & Kick to Target","Kick, Follow & Support"],
"Catching":["Toss, Turn & Catch","Move & Catch","Catch and Release","High Catch on the Move","Catch, Turn & Pass"],
"Crouch Lift":["Crouch Lift Gates","Lift & Carry Relay","Pick-Up to Pass","Lift, Turn & Go","Crouch Lift Circuit"],
"Agility / Evasion":["Side-Step Slalom","Shadow & Escape","Gate Evasion","Turn & Escape","1 v 1 Escape"],
"Scoring":["Move & Finish","Mini Goal Challenge","Accuracy Challenge","Receive & Score","Solo & Score"],
"Decision Making":["3 v 3 End Zone","Find the Free Player","Two-Gate Choice","Pass or Carry","2 v 1 Decision Game"]},
"Advanced":{
"Hand / Fist Pass":["Pressure Give & Go","Fast Hands 4 v 2","Pass, Support & Switch","One-Touch Passing Game","Overload Possession"],
"Solo / Ball Carry":["Pressure Solo Slalom","1 v 1 Solo Escape","Solo, Feint & Finish","Traffic Solo Decision","Solo Under Pressure"],
"Kicking":["Kick Under Pressure","Kick to Moving Target","Long Kick & Support","Kick Pass Decision Game","Pressure Punt Kick"],
"Catching":["Contested High Catch","Catch Under Pressure","Catch, Turn & Release","Moving Reach Catch","Catch in Traffic"],
"Crouch Lift":["Pressure Crouch Lift","Lift & Escape","Lift, Turn & Pass Under Pressure","1 v 1 Ground Ball","Crouch Lift Decision Circuit"],
"Agility / Evasion":["1 v 1 Evasion","Pressure Side-Step","Double-Move Escape","Reaction Gate Evasion","Evasion to Score"],
"Scoring":["Pressure Finish","Decision Finish","Score After Contact","Timed Accuracy Challenge","2 v 1 Finish"],
"Decision Making":["4 v 3 End Zone","3 v 2 Transition","Overload Decision Game","Pass-Carry-Kick Choice","Conditioned Small-Sided Game"]}
};
function drillsFor(skill,level){return (LEVEL_DRILLS[level]&&LEVEL_DRILLS[level][skill])||DRILLS[skill]||[]}
var IMAGES={
"Hand / Fist Pass":"https://gaa-pathway-resources.com/images/skill_cards/gaa_skill_cards/fist_pass_skillcard_front.jpg",
"Catching":"https://learning.gaa.ie/sites/default/files/Coach/Files/High-Catch-skillcard_09_aw-1.png",
"Crouch Lift":"https://gaa-pathway-resources.com/images/skill_cards/gaa_skill_cards/crouch_list_skillcard_front.jpg"
};
function el(id){return document.getElementById(id)}
function escapeHtml(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function makeChips(id,defaults){var box=el(id);for(var i=0;i<SKILLS.length;i++){var b=document.createElement("button");b.type="button";b.className="chip"+(defaults.indexOf(i)>=0?" on":"");b.appendChild(document.createTextNode(SKILLS[i]));b.onclick=function(){this.className=this.className.indexOf(" on")>=0?"chip":"chip on"};box.appendChild(b)}}
function selectedSkills(id){var a=[],nodes=el(id).getElementsByClassName("chip");for(var i=0;i<nodes.length;i++){if(nodes[i].className.indexOf(" on")>=0)a.push(nodes[i].textContent)}return a}
function setSelect(id,value){var x=el(id),opts=x.options;for(var i=0;i<opts.length;i++){if(String(opts[i].value).toLowerCase()===String(value).toLowerCase()){x.selectedIndex=i;return}}}
window.showPanel=function(name){el("coach").className="panel"+(name==="coach"?" active":"");el("home").className="panel"+(name==="home"?" active":"");el("coachTab").className="tab"+(name==="coach"?" active":"");el("homeTab").className="tab"+(name==="home"?" active":"");window.scrollTo(0,0)};
function art(skill){if(IMAGES[skill])return '<img class="source-img" src="'+IMAGES[skill]+'" alt="'+escapeHtml(skill)+' skill diagram">';return '<div class="diagram" aria-label="Drill setup diagram"></div>'}
function drillOptions(skill,current,level){var a=drillsFor(skill,level),h="";for(var i=0;i<a.length;i++)h+='<option value="'+escapeHtml(a[i])+'"'+(a[i]===current?' selected':'')+'>'+escapeHtml(a[i])+'</option>';return h}
function skillOptions(current){var h="";for(var i=0;i<SKILLS.length;i++)h+='<option value="'+escapeHtml(SKILLS[i])+'"'+(SKILLS[i]===current?' selected':'')+'>'+escapeHtml(SKILLS[i])+'</option>';return h}
window.changeCoachSkill=function(i){var sk=el("coachSkill"+i),dr=el("coachDrill"+i);if(!sk||!dr)return;dr.innerHTML=drillOptions(sk.value,"",el("level").value);var title=el("coachDrillTitle"+i),meta=el("coachSkillMeta"+i);if(title)title.textContent=dr.value;if(meta)meta.textContent=sk.value}
window.changeCoachDrill=function(i){var box=el("coachDrill"+i);if(!box)return;var title=el("coachDrillTitle"+i);if(title)title.textContent=box.value}
window.changeHomeSkill=function(i){var d=window._homeDraft,sk=el("homeSkill"+i),dr=el("homeDrill"+i);if(!d||!d.skills[i]||!sk||!dr)return;d.skills[i].skill=sk.value;dr.innerHTML=drillOptions(sk.value,"",d.level);d.skills[i].drill=dr.value;renderParentPreview()}
window.changeHomeDrill=function(i){var box=el("homeDrill"+i);if(!box)return;var d=window._homeDraft;if(d&&d.skills[i])d.skills[i].drill=box.value;renderParentPreview()}
window.readQuick=function(){var t=el("quickText").value.toLowerCase();var m=t.match(/(?:under\s*)?u?\s*(7|8|9|10|11|12)\b/);if(m)setSelect("age","U"+m[1]);m=t.match(/(\d+)\s*(?:players|children|kids)/);if(m)el("players").value=m[1];m=t.match(/(?:session(?:\s+length)?(?:\s+(?:is|about|around))?|for)\s*(\d{2,3})\s*(?:minutes|minute|mins|min)\b/);if(!m)m=t.match(/(\d{2,3})[ -]*(?:minute|min)\s+session/);if(m)el("sessionLength").value=m[1];m=t.match(/(\d+)\s*stations?/);if(m)setSelect("stations",m[1]);if(t.indexOf("beginner")>=0)setSelect("level","Beginner");else if(t.indexOf("advanced")>=0)setSelect("level","Advanced");else if(t.indexOf("intermediate")>=0)setSelect("level","Intermediate");m=t.match(/(5|8|10|15)\s*(?:minutes|minute|mins|min)\s*(?:each|per station)/);if(m)setSelect("stationMinutes",m[1]);if(/\b(no|without|skip)\s+(match|matches|game|games)/.test(t))setSelect("matches","no");else if(/\b(match|matches|game|games)\b/.test(t))setSelect("matches","yes");m=t.match(/(1|2|3|4)\s*(?:match\s*)?(?:pitch|pitches|picture|pictures)/);if(m)setSelect("pitches",m[1]);var bibs=document.getElementsByClassName("bib"),any=false;for(var i=0;i<bibs.length;i++){var hit=t.indexOf(bibs[i].value.toLowerCase())>=0;if(hit)any=true;bibs[i].checked=hit}if(!any)for(i=0;i<bibs.length;i++)bibs[i].checked=true};
window.generateSession=function(){var ss=selectedSkills("coachSkills");if(!ss.length){el("coachNotice").innerHTML='<div class="notice">Please choose at least one skill.</div>';return}var bibs=[],bs=document.getElementsByClassName("bib");for(var i=0;i<bs.length;i++)if(bs[i].checked)bibs.push(bs[i].value);if(!bibs.length){el("coachNotice").innerHTML='<div class="notice">Please choose at least one bib colour.</div>';return}el("coachNotice").innerHTML="";var n=parseInt(el("stations").value,10),players=parseInt(el("players").value,10),pp=Math.ceil(players/n),level=el("level").value,h='<div class="card"><h2>'+escapeHtml(el("age").value)+' · '+escapeHtml(el("sessionLength").value)+'-minute session</h2><div class="meta">'+players+' players · '+n+' stations · '+escapeHtml(level)+'</div><p><b>Every station can be changed.</b> Choose a different skill category or choose any alternative drill at this level.</p></div>';for(i=0;i<n;i++){var sk=ss[i%ss.length],arr=drillsFor(sk,level),dr=arr[i%arr.length],bib=bibs[i%bibs.length];h+='<div class="card station"><h3>'+escapeHtml(bib)+' · Station '+(i+1)+': <span id="coachDrillTitle'+i+'">'+escapeHtml(dr)+'</span></h3><div class="meta"><span id="coachSkillMeta'+i+'">'+escapeHtml(sk)+'</span> · about '+pp+' players · '+escapeHtml(el("stationMinutes").value)+' minutes</div><div class="grid" style="margin:10px 0"><div><label>Change skill category</label><select id="coachSkill'+i+'" onchange="changeCoachSkill('+i+')">'+skillOptions(sk)+'</select></div><div><label>Change drill ('+escapeHtml(level)+')</label><select id="coachDrill'+i+'" onchange="changeCoachDrill('+i+')">'+drillOptions(sk,dr,level)+'</select></div></div>'+art(sk)+'<b>Set-up</b><p>Use a small marked area, footballs and cones. Keep queues short and maximise touches.</p><b>Coaching cues</b><p>Head up · balanced body position · controlled touch · move after releasing the ball.</p></div>'}if(el("matches").value==="yes")h+='<div class="card"><h3>🏁 Matches</h3><p>'+escapeHtml(el("pitches").value)+' small-sided pitches. Split players evenly and prioritise equal playing time.</p></div>';h+='<div class="card controls"><button type="button" class="btn" onclick="window.print()">Print / Save as PDF</button></div>';el("sessionOut").innerHTML=h;el("sessionOut").scrollIntoView()};
function programme(){var ss=selectedSkills("homeSkills"),arr=[],level=el("homeLevel").value;for(var i=0;i<ss.length&&i<4;i++){var a=drillsFor(ss[i],level);arr.push({skill:ss[i],target:i%2?"10 successful attempts":"Practise for 10 minutes",drill:a[i%a.length]})}return {age:el("homeAge").value,week:el("week").value,level:level,skills:arr}}
function encodeData(o){var json=encodeURIComponent(JSON.stringify(o)),b64=btoa(unescape(json));return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decodeData(v){try{v=v.replace(/-/g,"+").replace(/_/g,"/");while(v.length%4)v+="=";return JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){return null}}
window.generateHome=function(){var d=programme();if(!d.skills.length){el("shareArea").innerHTML='<div class="notice">Please choose at least one Home Skill.</div>';return}window._homeDraft=d;var h='<div class="card"><h2>Choose the exact drills</h2><p class="meta">These are '+escapeHtml(d.level)+' drills. Change the skill category or choose another drill for any item before creating the parent link.</p>';for(var i=0;i<d.skills.length;i++){var x=d.skills[i];h+='<div class="tick"><div class="grid"><div><label>Skill '+(i+1)+'</label><select id="homeSkill'+i+'" onchange="changeHomeSkill('+i+')">'+skillOptions(x.skill)+'</select></div><div><label>Drill ('+escapeHtml(d.level)+')</label><select id="homeDrill'+i+'" onchange="changeHomeDrill('+i+')">'+drillOptions(x.skill,x.drill,d.level)+'</select></div></div><div class="meta" style="margin-top:6px">'+escapeHtml(x.target)+'</div></div>'}h+='</div><div id="parentPreview"></div><p><button type="button" class="btn" onclick="createFinalParentLink()">Approve preview & create parent link</button></p>';el("homeOut").innerHTML=h;el("shareArea").innerHTML="";renderParentPreview();el("homeOut").scrollIntoView()};
function renderParentPreview(){var d=window._homeDraft;if(!d||!el("parentPreview"))return;var h='<div class="card"><h2>Parent preview</h2><p class="meta">This is what will be sent. The parent will enter the child\'s name and choose the reward after opening the link.</p><div class="grid"><div><label>Child\'s name</label><input disabled placeholder="Parent enters name"></div><div><label>Reward</label><input disabled placeholder="Parent chooses reward"></div></div><h3>This week\'s skills</h3>';for(var i=0;i<d.skills.length;i++){var x=d.skills[i];h+='<div class="tick"><b>'+escapeHtml(x.skill)+'</b><div>'+escapeHtml(x.drill)+'</div><div class="meta">'+escapeHtml(x.target)+'</div></div>'}h+='</div>';el("parentPreview").innerHTML=h}
window.createFinalParentLink=function(){var d=window._homeDraft;if(!d)return;for(var i=0;i<d.skills.length;i++){var sk=el("homeSkill"+i),x=el("homeDrill"+i);if(sk)d.skills[i].skill=sk.value;if(x)d.skills[i].drill=x.value}var url=location.origin+location.pathname+"?home="+encodeData(d);el("shareArea").innerHTML='<div class="sharebox"><b>Parent Home Skills link ready</b><p class="meta">The link contains the drills you selected. The parent enters the child\'s name and chooses the reward.</p><input id="parentLink" readonly value="'+escapeHtml(url)+'"><div class="row" style="margin-top:9px"><button type="button" class="btn" onclick="copyParentLink()">Copy parent link</button><button type="button" class="btn secondary" onclick="previewParent()">Preview exactly what the parent sees</button></div></div>';el("shareArea").scrollIntoView()};
window.copyParentLink=function(){var x=el("parentLink");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x.value)}else{x.select();document.execCommand("copy")}};
window.previewParent=function(){window.open(el("parentLink").value,"_blank")};
function progressKey(){return "gaa-home-"+(new URLSearchParams(location.search).get("home")||"coach")}
function renderHome(d,parent){var h='<div class="card"><h2>'+(parent?"Home Football Skills":"Weekly Home Programme")+'</h2><div class="meta">'+escapeHtml(d.week)+' · '+escapeHtml(d.age)+'</div>';if(parent)h+='<div class="grid" style="margin-top:14px"><div><label>Child\'s name</label><input id="parentChild" placeholder="Enter child\'s name" oninput="saveProgress()"></div><div><label>Reward</label><input id="parentReward" placeholder="Parent chooses the reward" oninput="saveProgress()"></div></div>';h+='<h3>This week\'s skills</h3>';for(var i=0;i<d.skills.length;i++){var x=d.skills[i];h+='<div class="tick"><div class="tickrow"><input class="homeCheck" type="checkbox" onchange="checkHome()"><div><b>'+escapeHtml(x.skill)+'</b><div class="meta">'+escapeHtml(x.target)+' · '+escapeHtml(x.drill)+'</div></div></div>'+art(x.skill)+'</div>'}h+='<div id="success" class="success hidden"><div class="star">⭐</div><h2>WEEK COMPLETE!</h2></div>';if(parent)h+='<p><button type="button" class="btn" onclick="submitWeek()">Submit week to coach</button></p><div id="submitOut"></div>';h+='</div>';el("homeOut").innerHTML=h;if(parent)restoreProgress()}
window.saveProgress=function(){if(document.body.className.indexOf("parent-mode")<0)return;var c=document.getElementsByClassName("homeCheck"),checks=[];for(var i=0;i<c.length;i++)checks.push(c[i].checked);var nm=el("parentChild")?el("parentChild").value:"",rw=el("parentReward")?el("parentReward").value:"";localStorage.setItem(progressKey(),JSON.stringify({name:nm,reward:rw,checks:checks}))};
window.checkHome=function(){var c=document.getElementsByClassName("homeCheck"),ok=c.length>0;for(var i=0;i<c.length;i++)if(!c[i].checked)ok=false;var s=el("success");if(s)s.className=ok?"success":"success hidden";window.saveProgress()};
function restoreProgress(){try{var p=JSON.parse(localStorage.getItem(progressKey())||"{}");if(p.name)el("parentChild").value=p.name;if(p.reward&&el("parentReward"))el("parentReward").value=p.reward;var c=document.getElementsByClassName("homeCheck");for(var i=0;i<c.length;i++)c[i].checked=!!(p.checks&&p.checks[i]);window.checkHome()}catch(e){}}
window.submitWeek=function(){var nm=el("parentChild").value.replace(/^\s+|\s+$/g,"");if(!nm){el("submitOut").innerHTML='<div class="notice">Please enter the child\'s name first.</div>';return}var q=new URLSearchParams(location.search).get("home"),d=decodeData(q),c=document.getElementsByClassName("homeCheck"),lines=[],done=0;for(var i=0;i<d.skills.length;i++){if(c[i].checked)done++;lines.push((c[i].checked?"✓ ":"○ ")+d.skills[i].skill+" — "+(c[i].checked?"Completed":"Not completed"))}var rw=el("parentReward")?el("parentReward").value.replace(/^\s+|\s+$/g,""):"";var msg="GAA Home Skills — "+d.week+"\nChild: "+nm+(rw?"\nReward: "+rw:"")+"\n\n"+lines.join("\n")+"\n\nCompleted: "+done+"/"+d.skills.length;window._summary=msg;el("submitOut").innerHTML='<div class="summary"><b>Weekly progress ready to send</b><p>'+escapeHtml(lines.join("\n")).replace(/\n/g,"<br>")+'</p><div class="row"><a class="btn" style="text-decoration:none" href="mailto:?subject='+encodeURIComponent("GAA Home Skills — "+nm)+'&body='+encodeURIComponent(msg)+'">Send by email</a><button type="button" class="btn secondary" onclick="copySummary()">Copy summary</button></div></div>'};
window.copySummary=function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(window._summary||"")};
function init(){makeChips("coachSkills",[0,1,2,3]);makeChips("homeSkills",[0,1,2]);var q=new URLSearchParams(location.search).get("home");if(q){var d=decodeData(q);if(d){document.body.className="parent-mode";el("brand").textContent="🏐 GAA Home Skills";renderHome(d,true);return}}window.showPanel("coach")}
init();
})();
</script>
</body>
</html>
